name: Create/Destroy Lab Infra

# Runs the "provision the lab instance" step entirely on GitHub-hosted
# runners — no local Terraform/Ansible/AWS CLI install needed.
#
# State handling: Terraform state lives in the S3 bucket configured in
# terraform/backend.tf. No artifacts, no state passing between runs — every
# job just runs `terraform init` and reads/writes the same S3 state.
#
# Two manual dispatches (the approval gate is "a human chose to run this a
# second time after reading the plan"):
#   stage: plan    — computes the Terraform plan (create or destroy) and
#                    posts it to the job summary. Read-only, touches nothing.
#   stage: confirm — run it after reading the plan summary. Plans again
#                    against the current S3 state and applies. Because state
#                    is in S3, whatever you saw in the plan stage is what
#                    will happen here (as long as nothing else changed AWS
#                    in between).
#
# SSH key handling: create an AWS key pair once yourself, put its private
# key in the EC2_SSH_KEY repo secret, and pass the key pair's name as the
# key_name input.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply (create/update the lab instance) or destroy (tear it down)"
        type: choice
        options: [apply, destroy]
        default: apply
      stage:
        description: "plan first (review the job summary), then confirm as a separate manual run to actually apply it"
        type: choice
        options: [plan, confirm]
        default: plan
      key_name:
        description: "Name of an EC2 key pair you already created in AWS — its private key must be in the EC2_SSH_KEY repo secret"
        required: true
        default: "shoplist-key"
      image_tag:
        description: "Image tag to deploy on apply+confirm (default: current commit's short SHA — make sure ci-cd.yml already built+pushed it, and the ghcr.io packages are public)"
        required: false
        default: ""

env:
  AWS_REGION: eu-west-1

# S3 backend has no locking here, so never let two runs touch state at once.
concurrency:
  group: lab-infra
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: inputs.stage == 'plan'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # The wrapper corrupts $(terraform output ...) captures — keep it off.
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform plan (apply)
        if: inputs.action == 'apply'
        working-directory: terraform
        run: terraform plan -input=false -var "key_name=${{ inputs.key_name }}" -out=tfplan

      - name: Terraform plan (destroy)
        if: inputs.action == 'destroy'
        working-directory: terraform
        run: terraform plan -destroy -input=false -var "key_name=${{ inputs.key_name }}" -out=tfplan

      - name: Post plan to job summary for review
        working-directory: terraform
        run: |
          {
            echo "### Terraform plan (action: ${{ inputs.action }}, key_name: ${{ inputs.key_name }})"
            echo ""
            echo "Review this, then run this workflow again with **stage: confirm** and the same action/key_name to apply it."
            echo ""
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  confirm:
    if: inputs.stage == 'confirm'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -input=false -auto-approve -var "key_name=${{ inputs.key_name }}"

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        working-directory: terraform
        run: terraform apply -destroy -input=false -auto-approve -var "key_name=${{ inputs.key_name }}"

      - name: Get public IP
        if: inputs.action == 'apply'
        working-directory: terraform
        run: echo "PUBLIC_IP=$(terraform output -raw public_ip)" >> "$GITHUB_ENV"

      - name: Write SSH private key from the EC2_SSH_KEY secret
        if: inputs.action == 'apply'
        working-directory: terraform
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > lab-key
          chmod 600 lab-key

      - name: Wait for SSH
        if: inputs.action == 'apply'
        working-directory: terraform
        timeout-minutes: 5
        run: |
          until ssh -i lab-key -o StrictHostKeyChecking=no -o ConnectTimeout=5 \
            "ubuntu@${PUBLIC_IP}" true 2>/dev/null; do
            echo "waiting for SSH on ${PUBLIC_IP}..."
            sleep 5
          done

      - name: Write Ansible inventory
        if: inputs.action == 'apply'
        run: |
          mkdir -p ansible/inventory
          cat > ansible/inventory/hosts.ini <<EOF
          [shoplist]
          ${PUBLIC_IP} ansible_user=ubuntu ansible_ssh_private_key_file=${{ github.workspace }}/terraform/lab-key
          EOF

      - name: Install Ansible
        if: inputs.action == 'apply'
        run: pip install --quiet ansible

      - name: Install minikube on the lab instance
        if: inputs.action == 'apply'
        run: ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/install-minikube.yml

      - name: Deploy ShopList
        if: inputs.action == 'apply'
        run: |
          ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/deploy-app.yml \
            -e "github_owner=${{ github.repository_owner }}" -e "image_tag=${IMAGE_TAG}"

      - name: Job summary (apply)
        if: inputs.action == 'apply'
        run: |
          {
            echo "### ShopList lab instance is up"
            echo ""
            echo "App: http://${PUBLIC_IP}:30080"
            echo ""
            echo "**Next step — add 1 repo secret** (Settings → Secrets and variables → Actions) so the CI/CD pipeline can deploy updates:"
            echo ""
            echo "\`EC2_HOST\` = \`${PUBLIC_IP}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary (destroy)
        if: inputs.action == 'destroy'
        run: echo "### Lab instance destroyed — remove the EC2_HOST secret if you're done with the lab (EC2_SSH_KEY and the AWS key pair can stay for next time)" >> "$GITHUB_STEP_SUMMARY"
